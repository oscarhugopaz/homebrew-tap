name: Update Twenty CLI formula

on:
  schedule:
    - cron: "37 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-twenty-cli
  cancel-in-progress: false

jobs:
  update:
    name: Update Twenty CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Find latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/salmonumbrella/twenty-cli/releases?per_page=100")"

          release="$(jq -c '
            map(select(
              .draft == false and
              .prerelease == false and
              (.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))
            )) | first // empty
          ' <<<"${releases}")"

          if [[ -z "${release}" ]]; then
            echo "No stable Twenty CLI release found" >&2
            exit 1
          fi

          tag="$(jq -r '.tag_name' <<<"${release}")"
          version="${tag#v}"
          current="$(ruby -ne 'if $_ =~ %r{/download/v([^/]+)/twenty_}; puts $1; exit; end' Formula/twenty-cli.rb)"

          if [[ -z "${current}" ]]; then
            echo "Could not determine the current formula version" >&2
            exit 1
          fi

          if [[ "${version}" == "${current}" ]]; then
            echo "Twenty CLI ${version} is already current"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! ruby -e 'require "rubygems"; exit Gem::Version.new(ARGV[0]) > Gem::Version.new(ARGV[1])' "${version}" "${current}"; then
            echo "Latest release ${version} is not newer than formula version ${current}" >&2
            exit 1
          fi

          checksums_name="checksums.txt"
          asset_names=(
            "twenty_${version}_darwin_arm64.tar.gz"
            "twenty_${version}_darwin_amd64.tar.gz"
            "twenty_${version}_linux_arm64.tar.gz"
            "twenty_${version}_linux_amd64.tar.gz"
          )

          checksums_url="$(jq -r --arg name "${checksums_name}" '.assets[] | select(.name == $name) | .browser_download_url' <<<"${release}")"
          if [[ -z "${checksums_url}" ]]; then
            echo "Stable release ${tag} does not contain ${checksums_name}" >&2
            exit 1
          fi

          {
            echo "changed=true"
            echo "current=${current}"
            echo "version=${version}"
            echo "checksums_url=${checksums_url}"
          } >> "${GITHUB_OUTPUT}"

          for name in "${asset_names[@]}"; do
            url="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .browser_download_url' <<<"${release}")"
            if [[ -z "${url}" ]]; then
              echo "Stable release ${tag} does not contain ${name}" >&2
              exit 1
            fi
            key="${name#twenty_${version}_}"
            key="${key%.tar.gz}"
            echo "${key}_url=${url}" >> "${GITHUB_OUTPUT}"
          done

      - name: Download and verify release assets
        if: steps.release.outputs.changed == 'true'
        env:
          CHECKSUMS_URL: ${{ steps.release.outputs.checksums_url }}
          DARWIN_ARM64_URL: ${{ steps.release.outputs.darwin_arm64_url }}
          DARWIN_AMD64_URL: ${{ steps.release.outputs.darwin_amd64_url }}
          LINUX_ARM64_URL: ${{ steps.release.outputs.linux_arm64_url }}
          LINUX_AMD64_URL: ${{ steps.release.outputs.linux_amd64_url }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir release-assets
          curl --fail --silent --show-error --location --retry 3 --output release-assets/checksums.txt "${CHECKSUMS_URL}"

          for platform in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            asset="twenty_${VERSION}_${platform}.tar.gz"
            case "${platform}" in
              darwin_arm64) url="${DARWIN_ARM64_URL}" ;;
              darwin_amd64) url="${DARWIN_AMD64_URL}" ;;
              linux_arm64) url="${LINUX_ARM64_URL}" ;;
              linux_amd64) url="${LINUX_AMD64_URL}" ;;
            esac
            curl --fail --silent --show-error --location --retry 3 --output "release-assets/${asset}" "${url}"

            published_sha="$(awk -v asset="${asset}" '$2 == asset { print $1 }' release-assets/checksums.txt)"
            if [[ ! "${published_sha}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Missing or invalid official checksum for ${asset}" >&2
              exit 1
            fi

            downloaded_sha="$(shasum -a 256 "release-assets/${asset}" | awk '{print $1}')"
            if [[ "${downloaded_sha}" != "${published_sha}" ]]; then
              echo "Checksum mismatch for ${asset}" >&2
              exit 1
            fi

            echo "${platform}_sha=${published_sha}" >> "${GITHUB_ENV}"
          done

      - name: Update formula
        if: steps.release.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.release.outputs.current }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ruby <<'RUBY'
          path = "Formula/twenty-cli.rb"
          content = File.read(path)
          current = ENV.fetch("CURRENT")
          version = ENV.fetch("VERSION")
          old_prefix = "/download/v#{current}/twenty_#{current}_"
          new_prefix = "/download/v#{version}/twenty_#{version}_"

          unless content.scan(old_prefix).length == 4
            abort "Expected four release URLs for Twenty CLI #{current}"
          end
          content.gsub!(old_prefix, new_prefix)

          %w[darwin_arm64 darwin_amd64 linux_arm64 linux_amd64].each do |platform|
            checksum = ENV.fetch("#{platform}_sha")
            pattern = /(twenty_#{Regexp.escape(version)}_#{platform}\.tar\.gz"\n\s+sha256 ")[0-9a-f]{64}"/
            unless content.scan(pattern).length == 1
              abort "Could not find one checksum field for #{platform}"
            end
            content.sub!(pattern) { "#{Regexp.last_match(1)}#{checksum}\"" }
          end

          File.write(path, content)
          RUBY

      - name: Validate formula
        if: steps.release.outputs.changed == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ruby -c Formula/twenty-cli.rb
          brew style Formula/twenty-cli.rb
          brew tap oscarhugopaz/tap .
          cp Formula/twenty-cli.rb "$(brew --repository oscarhugopaz/tap)/Formula/twenty-cli.rb"
          brew audit --strict --online oscarhugopaz/tap/twenty-cli
          brew install oscarhugopaz/tap/twenty-cli
          test "$(twenty --version)" = "${VERSION}"
          brew test oscarhugopaz/tap/twenty-cli

      - name: Commit and push
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/twenty-cli.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update Twenty CLI to ${VERSION}"
          git push origin HEAD:main
