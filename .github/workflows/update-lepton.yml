name: Update Lepton cask

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lepton
  cancel-in-progress: false

jobs:
  update:
    name: Update Lepton
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Find latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/hackjutsu/Lepton/releases?per_page=100")"

          release="$(jq -c '
            map(select(
              .draft == false and
              .prerelease == false and
              (.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))
            )) | first // empty
          ' <<<"${releases}")"

          if [[ -z "${release}" ]]; then
            echo "No stable Lepton release found" >&2
            exit 1
          fi

          tag="$(jq -r '.tag_name' <<<"${release}")"
          version="${tag#v}"
          arm_name="Lepton-${version}-mac-arm64.dmg"
          x64_name="Lepton-${version}-mac-x64.dmg"
          arm_url="$(jq -r --arg name "${arm_name}" '.assets[] | select(.name == $name) | .browser_download_url' <<<"${release}")"
          x64_url="$(jq -r --arg name "${x64_name}" '.assets[] | select(.name == $name) | .browser_download_url' <<<"${release}")"

          if [[ -z "${arm_url}" || -z "${x64_url}" ]]; then
            echo "Stable release ${tag} does not contain both expected macOS DMGs" >&2
            exit 1
          fi

          current="$(ruby -ne 'if $_ =~ /^\s*version "([^"]+)"/; puts $1; exit; end' Casks/lepton.rb)"
          if [[ "${version}" == "${current}" ]]; then
            echo "Lepton ${version} is already current"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "changed=true"
            echo "version=${version}"
            echo "arm_url=${arm_url}"
            echo "x64_url=${x64_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download release assets
        if: steps.release.outputs.changed == 'true'
        env:
          ARM_URL: ${{ steps.release.outputs.arm_url }}
          X64_URL: ${{ steps.release.outputs.x64_url }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output lepton-arm64.dmg "${ARM_URL}"
          curl --fail --silent --show-error --location --retry 3 --output lepton-x64.dmg "${X64_URL}"
          echo "arm_sha=$(shasum -a 256 lepton-arm64.dmg | awk '{print $1}')" >> "${GITHUB_ENV}"
          echo "x64_sha=$(shasum -a 256 lepton-x64.dmg | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Update cask
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ruby <<'RUBY'
          path = "Casks/lepton.rb"
          content = File.read(path)
          unless content.sub!(/^  version "[^"]+"$/, "  version \"#{ENV.fetch("VERSION")}\"")
            abort "Could not update version"
          end
          unless content.sub!(
            /^  sha256 arm:\s+"[0-9a-f]{64}",\n\s+intel:\s+"[0-9a-f]{64}"$/,
            "  sha256 arm:   \"#{ENV.fetch("arm_sha")}\",\n         intel: \"#{ENV.fetch("x64_sha")}\"",
          )
            abort "Could not update checksums"
          end
          File.write(path, content)
          RUBY

      - name: Validate cask
        if: steps.release.outputs.changed == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          ruby -c Casks/lepton.rb
          brew style Casks/lepton.rb
          brew tap oscarhugopaz/tap .
          cp Casks/lepton.rb "$(brew --repository oscarhugopaz/tap)/Casks/lepton.rb"
          brew audit --cask --strict --online oscarhugopaz/tap/lepton

      - name: Commit and push
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lepton.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update Lepton to ${VERSION}"
          git push origin HEAD:main
